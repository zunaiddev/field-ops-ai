services:
  postgres:
    image: postgres:16-alpine
    container_name: fieldops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: fieldops
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    container_name: fieldops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"